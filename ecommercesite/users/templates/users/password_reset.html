{% extends 'core/base.html' %}
{% load static %}
{% block content %}
<main class="px-0 py-8 mx-0 w-full min-h-screen bg-white">
<div class="container px-4 mx-auto bg-white">
<div class="flex justify-center items-center px-4 py-12 min-h-screen bg-white sm:px-6 lg:px-8">
  <div class="p-6 space-y-8 w-full max-w-md bg-white rounded-lg shadow-md">
    <h2 class="text-3xl font-bold text-center text-gray-900">Restablecer Contraseña</h2>
    <p class="text-sm text-center text-gray-600">Ingresa tu correo para recibir un enlace de restablecimiento.</p>
    
    <form method="post" class="space-y-6">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit"
              class="flex justify-center px-4 py-2 w-full text-sm font-medium text-white bg-indigo-600 rounded-md border border-transparent shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        Enviar
      </button>
    </form>
    
    <p class="text-sm text-center text-gray-600">
      <a href="{% url 'users:login' %}" class="text-indigo-600 hover:text-indigo-500">Volver al inicio de sesión</a>
    </p>
  </div>
</div>
{% endblock %}
