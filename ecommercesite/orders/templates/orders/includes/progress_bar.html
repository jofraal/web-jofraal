<!-- orders/templates/orders/includes/progress_bar.html -->
<div class="mb-8 progress-bar-container">
    <div class="relative p-6 bg-white rounded-2xl border border-gray-100 shadow-lg">
        <!-- Título del progreso -->
        <div class="mb-6 text-center">
            <h2 class="mb-2 text-xl font-bold text-gray-800">Proceso de compra</h2>
            <p class="text-sm text-gray-600">Completa estos pasos para finalizar tu pedido</p>
        </div>
        
        <!-- Barra de progreso principal -->
        <div class="relative mb-8">
            <div class="flex overflow-hidden h-2.5 bg-gray-100 rounded-full shadow-inner progress-bar">
                <div class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-full shadow-md transition-all duration-700 ease-in-out progress-bar-fill checkout-progress-bar" style="width: 0%"></div>
            </div>
            <!-- Indicador de porcentaje -->
            <div id="progress-percentage" class="absolute -top-1 text-xs font-bold text-indigo-600 bg-white px-2 py-0.5 rounded-full shadow-sm border border-indigo-200 transition-all duration-700 progress-percentage" style="left: 0%; transform: translateX(-50%);">0%</div>
        </div>
        
        <!-- Pasos del proceso -->
        <div class="flex relative justify-between">
            <!-- Líneas conectoras -->
            <div class="absolute right-0 left-0 top-6 h-0.5 bg-gray-200 -z-10"></div>
            
            <!-- Paso 1: Identificación -->
            <div class="flex relative z-10 flex-col items-center progress-step active">
                <div class="flex justify-center items-center mb-3 w-12 h-12 text-white bg-gradient-to-br from-indigo-500 to-purple-600 rounded-full border-[3px] border-white shadow-lg ring-2 ring-indigo-200 transition-all duration-300 hover:shadow-xl hover:scale-110 step-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <span class="text-sm font-bold text-center text-indigo-700 step-title">Identificación</span>
                <span class="mt-1 text-xs text-center text-gray-500 step-subtitle">Datos personales</span>
            </div>
            
            <!-- Paso 2: Envío -->
            <div class="flex relative z-10 flex-col items-center progress-step">
                <div class="flex justify-center items-center mb-3 w-12 h-12 text-gray-600 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full border-4 border-white shadow-md transition-all duration-300 hover:shadow-lg hover:scale-105 step-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <span class="text-sm font-semibold text-center text-gray-600 step-title">Envío</span>
                <span class="mt-1 text-xs text-center text-gray-500 step-subtitle">Dirección de entrega</span>
            </div>
            
            <!-- Paso 3: Pago -->
            <div class="flex relative z-10 flex-col items-center progress-step">
                <div class="flex justify-center items-center mb-3 w-12 h-12 text-gray-600 bg-gradient-to-br from-gray-300 to-gray-400 rounded-full border-4 border-white shadow-md transition-all duration-300 hover:shadow-lg hover:scale-105 step-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                </div>
                <span class="text-sm font-semibold text-center text-gray-600 step-title">Pago</span>
                <span class="mt-1 text-xs text-center text-gray-500 step-subtitle">Método de pago</span>
            </div>
        </div>
        
        <!-- Indicador de paso actual -->
        <div class="mt-6 text-center">
            <div class="inline-flex items-center px-4 py-2 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-full border border-indigo-200 shadow-sm">
                <div class="mr-2 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"></div>
                <span class="text-sm font-medium text-indigo-700 current-step-text">Paso 1: Completando identificación</span>
            </div>
        </div>
    </div>
</div>
