{% load static %}
<!-- Navegación superior -->
<nav class="container flex justify-between items-center p-3 mx-auto max-w-7xl transition-all duration-300 ease-in-out sm:p-4">
  <a href="{% url 'core:home' %}" class="text-2xl italic font-bold text-gray-800 transition-colors duration-300 hover:text-blue-600">Jonathan Fraal</a>
  <div class="flex items-center space-x-4">
    {% if user.is_authenticated %}
      <!-- Perfil -->
      <a href="{% url 'users:profile' %}" class="relative text-gray-800 transition-colors duration-300 hover:text-blue-600 group" title="Perfil">
        <svg class="w-5 h-5 transition-transform duration-300 transform group-hover:scale-110" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A6 6 0 0112 15a6 6 0 016.879 2.804M12 12a4 4 0 100-8 4 4 0 000 8z" />
        </svg>
      </a>
      <!-- Cerrar Sesión -->
      <a href="{% url 'users:logout' %}" class="relative text-gray-800 transition-colors duration-300 hover:text-blue-600 group" title="Cerrar Sesión">
        <svg class="w-5 h-5 transition-transform duration-300 transform group-hover:scale-110" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h3a3 3 0 013 3v1" />
        </svg>
      </a>
    {% else %}
      <!-- Iniciar Sesión -->
      <a href="{% url 'users:login' %}" class="relative text-gray-800 transition-colors duration-300 hover:text-blue-600 group" title="Iniciar Sesión">
        <svg class="w-5 h-5 transition-transform duration-300 transform group-hover:scale-110" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
      </a>
      <!-- Crear Cuenta -->
      <a href="{% url 'users:register' %}" class="relative text-gray-800 transition-colors duration-300 hover:text-blue-600 group" title="Crear Cuenta">
        <svg class="w-5 h-5 transition-transform duration-300 transform group-hover:scale-110" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </a>
    {% endif %}
    <!-- Carrito -->
    <a href="{% url 'cart:cart_detail' %}" class="relative text-gray-800 transition-colors duration-300 hover:text-blue-600 group" title="Carrito">
      <div class="relative">
        <svg class="w-5 h-5 transition-transform duration-300 transform group-hover:scale-110" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 20.5c0 .829-.672 1.5-1.5 1.5s-1.5-.671-1.5-1.5c0-.828.672-1.5 1.5-1.5s1.5.672 1.5 1.5zm3.5-1.5c-.828 0-1.5.671-1.5 1.5s.672 1.5 1.5 1.5 1.5-.671 1.5-1.5c0-.828-.672-1.5-1.5-1.5zm6.305-15l-3.432 12h-10.428l-3.777-9h-2.168l4.615 11h13.239l3.474-12h1.929l.743-2h-4.195zm-5.948 10c1.039-6.826-3.961-10.102-3.961-10.102l.778-1.898-5.389 2.26 2.27 5.384.809-2.006c-.001 0 4.591 1.74 5.493 6.362z"/>
        </svg>
        <span id="cart-counter" class="flex absolute -top-2 -right-2 justify-center items-center w-5 h-5 text-xs font-bold text-white bg-red-500 rounded-full cart-counter hidden">0</span>
      </div>
    </a>
  </div>
</nav>

<!-- Navegación secundaria -->
<nav class="py-3 bg-gradient-to-r from-gray-50 to-white border-b border-gray-300 shadow-sm sm:py-4 md:py-5">
  <div class="container flex flex-wrap justify-center px-3 mx-auto space-x-3 max-w-7xl text-xs font-medium sm:px-4 sm:space-x-5 sm:text-sm md:space-x-10">
    <a href="{% url 'core:home' %}" class="relative py-2 text-gray-800 transition-colors duration-300 hover:text-blue-600 group">
      <span>HOME</span>
      <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-300 group-hover:w-full"></span>
    </a>
    <a href="{% url 'products:product_list_by_gender' 'M' %}" class="relative py-2 text-gray-800 transition-colors duration-300 hover:text-blue-600 group">
      <span>HOMBRE</span>
      <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-300 group-hover:w-full"></span>
    </a>
    <a href="{% url 'products:product_list_by_gender' 'W' %}" class="relative py-2 text-gray-800 transition-colors duration-300 hover:text-blue-600 group">
      <span>MUJER</span>
      <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-300 group-hover:w-full"></span>
    </a>
    <a href="{% url 'products:product_list_by_gender' 'U' %}" class="relative py-2 text-gray-800 transition-colors duration-300 hover:text-blue-600 group">
      <span>UNISEX</span>
      <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-300 group-hover:w-full"></span>
    </a>
    <a href="{% url 'products:product_list' %}?category=infantil" class="relative py-2 text-gray-800 transition-colors duration-300 hover:text-blue-600 group">
      <span>INFANTIL</span>
      <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-300 group-hover:w-full"></span>
    </a>
    <a href="{% url 'products:product_list' %}?category=accesorios" class="relative py-2 text-gray-800 transition-colors duration-300 hover:text-blue-600 group">
      <span>ACCESORIOS</span>
      <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-blue-500 transition-all duration-300 group-hover:w-full"></span>
    </a>
  </div>
</nav>
