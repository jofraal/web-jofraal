<!-- Breadcrumbs reutilizable -->
<nav class="flex mb-4 text-xs text-gray-500 sm:text-sm sm:mb-6" aria-label="Breadcrumb">
  <ol class="inline-flex flex-wrap items-center gap-1">
    <li class="inline-flex items-center">
      <a href="{% url 'core:home' %}" class="inline-flex items-center text-gray-500 transition-colors hover:text-indigo-600">
        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
        </svg>
        Inicio
      </a>
    </li>
    {% for item in breadcrumbs %}
      <li class="inline-flex items-center">
        <svg class="mx-1 w-4 h-4 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
        </svg>
        {% if item.url %}
          <a href="{{ item.url }}" class="text-gray-500 transition-colors hover:text-indigo-600">{{ item.label }}</a>
        {% else %}
          <span class="font-medium text-gray-900">{{ item.label }}</span>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
